<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情緒基地 v9.4 - 客製化美學版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F8F9FA; color: #4A4A4A; }
        .hidden { display: none !important; }
        .mood-btn { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); filter: grayscale(0.5); opacity: 0.6; }
        .mood-active { transform: scale(1.3); filter: grayscale(0); opacity: 1; border: 2px solid #A3B18A; border-radius: 50%; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .calendar-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; border-radius: 12px; background: #FFF; border: 1px solid #F0F0F0; }
        .shop-item { border: 1px solid #F0F0F0; border-radius: 1.5rem; padding: 12px; text-align: center; background: white; }
        .patchwork { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
        
        /* 拖曳家具樣式 */
        .draggable-decor { position: absolute; z-index: 30; cursor: move; user-select: none; touch-action: none; transition: transform 0.1s; }
        .draggable-decor:active { transform: scale(1.2); opacity: 0.8; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen bg-gray-50 shadow-xl overflow-x-hidden relative">

    <div id="setup-page" class="p-8 pt-20 flex flex-col items-center hidden">
        <h1 class="text-2xl font-light mb-2 text-[#91A3B0] tracking-widest">情緒基地</h1>
        <p class="text-xs text-gray-400 mb-8">自我照顧與溫暖共鳴的空間</p>
        <div class="w-full bg-white p-6 rounded-[2.5rem] shadow-sm border border-gray-100">
            <input id="init-nick" type="text" placeholder="想被怎麼稱呼呢？..." class="w-full bg-gray-50 border-none rounded-xl p-4 text-center text-sm focus:outline-none">
            <button onclick="confirmNickname()" class="w-full mt-4 py-4 bg-[#91A3B0] text-white rounded-xl shadow-md text-sm font-medium">開啟基地</button>
        </div>
    </div>

    <div id="home-page" class="p-6 pb-24 space-y-6 hidden">
        <header class="flex justify-between items-center">
            <div>
                <p id="display-date" class="text-[10px] text-gray-400 font-bold uppercase tracking-wider"></p>
                <h1 id="welcome-msg" class="text-xl font-medium text-gray-700">你好</h1>
            </div>
            <div class="bg-amber-100/70 px-3 py-1 rounded-full text-amber-600 text-xs font-bold">🪙 <span id="coin-balance">0</span></div>
        </header>

        <section class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-gray-50">
            <p class="text-[10px] text-center text-gray-400 mb-4 tracking-widest uppercase">Today's Mood</p>
            <div class="flex justify-around items-center" id="mood-selector">
                <button onclick="selectMood('good', '😊')" id="btn-good" class="mood-btn text-3xl">😊</button>
                <button onclick="selectMood('calm', '☁️')" id="btn-calm" class="mood-btn text-3xl">☁️</button>
                <button onclick="selectMood('tired', '😮‍💨')" id="btn-tired" class="mood-btn text-3xl">😮‍💨</button>
                <button onclick="selectMood('anxious', '😰')" id="btn-anxious" class="mood-btn text-3xl">😰</button>
                <button onclick="selectMood('angry', '😡')" id="btn-angry" class="mood-btn text-3xl">😡</button>
            </div>
            <p id="mood-feedback" class="text-center text-[11px] text-gray-400 mt-4 italic h-4"></p>
            <button id="mood-lock-btn" onclick="lockMood()" class="w-full mt-4 py-3 bg-gray-100 text-gray-400 text-[11px] rounded-xl font-medium tracking-wide">鎖定今日心情</button>
        </section>

        <div class="grid grid-cols-2 gap-3">
            <button onclick="openFriendRoomNav()" class="py-5 bg-white rounded-3xl text-sm border border-gray-100 shadow-sm text-gray-600">朋友房間</button>
            <button onclick="enterMatchRoom()" class="py-5 bg-[#A3B18A] rounded-3xl text-sm text-white shadow-sm font-medium">共鳴匹配</button>
            <button onclick="openShop()" class="py-5 bg-amber-50/60 rounded-3xl text-sm text-amber-700 border border-amber-100 shadow-sm">🛒 佈置商店</button>
            <button onclick="checkInDiary()" class="py-5 bg-blue-50/60 rounded-3xl text-sm text-blue-700 border border-blue-100 shadow-sm">📅 成長日誌</button>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <button id="task1-btn" onclick="doTask(1)" class="p-4 bg-white rounded-2xl text-[10px] text-left border border-gray-100 flex flex-col justify-between h-20 shadow-sm">
                <span class="text-gray-400 font-bold">TASK 01</span>
                <span class="text-gray-600">進行三次深呼吸 (+10🪙)</span>
            </button>
            <button id="task2-btn" onclick="doTask(2)" class="p-4 bg-white rounded-2xl text-[10px] text-left border border-gray-100 flex flex-col justify-between h-20 shadow-sm">
                <span class="text-gray-400 font-bold">TASK 02</span>
                <span class="text-gray-600">喝下一杯溫水 (+10🪙)</span>
            </button>
        </div>
    </div>

    <div id="chat-page" class="hidden fixed inset-0 bg-white z-50 flex flex-col max-w-md mx-auto shadow-2xl">
        <div id="chat-bg" class="patchwork transition-colors duration-500"></div>
        
        <div id="room-decorations" class="absolute inset-0 pointer-events-none z-10"></div>
        
        <nav class="relative z-20 p-5 flex justify-between items-center bg-white/40 backdrop-blur-md border-b border-white/20">
            <button onclick="goBack()" class="text-xs text-gray-600 font-medium">✕ 離開</button>
            <div class="text-center">
                <p id="chat-room-title" class="text-sm font-medium text-gray-700"></p>
                <p id="chat-room-id" class="text-[8px] text-gray-500 uppercase tracking-widest"></p>
            </div>
            <button onclick="copyRoomLink()" class="text-[10px] bg-gray-800 text-white px-3 py-1 rounded-full shadow-sm">邀請好友</button>
        </nav>
        
        <div id="chat-messages" class="relative z-20 flex-1 overflow-y-auto p-6 space-y-4"></div>
        
        <div class="relative z-20 p-6 bg-gradient-to-t from-white via-white to-transparent">
            <div class="bg-gray-50 rounded-full p-2 flex items-center border border-gray-200 shadow-inner">
                <label class="px-3 cursor-pointer text-xl hover:scale-110 transition">
                    📷<input type="file" accept="image/*" class="hidden" onchange="uploadFromAlbum(this)">
                </label>
                <input id="chat-input" type="text" placeholder="說點溫暖的話吧..." class="flex-1 bg-transparent border-none text-sm focus:outline-none px-2 focus:ring-0">
                <button onclick="sendMsg()" class="bg-gray-800 text-white px-6 py-2 rounded-full text-xs font-medium shadow-md">送出</button>
            </div>
        </div>
    </div>

    <div id="friend-nav-page" class="p-6 hidden">
        <button onclick="goBack()" class="mb-6 text-xs text-gray-400">✕ 返回</button>
        <h2 class="text-lg font-medium mb-4">朋友的小房間</h2>
        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-gray-100 mb-6">
            <input id="new-room-name" type="text" placeholder="給這個溫馨空間取個名字..." class="w-full bg-gray-50 border-none rounded-xl p-3 text-sm mb-3 focus:outline-none">
            <button onclick="createRoom()" class="w-full py-3 bg-[#91A3B0] text-white rounded-xl text-xs font-medium shadow-md">創建新空間</button>
        </div>
        <p class="text-[10px] text-gray-400 mb-2 font-bold tracking-wider uppercase">過往紀錄</p>
        <div id="history-rooms" class="space-y-2 max-h-[40vh] overflow-y-auto"></div>
    </div>

    <div id="shop-page" class="p-6 hidden">
        <nav class="flex justify-between items-center mb-6">
            <button onclick="goBack()" class="text-xs text-gray-400">✕ 關閉</button>
            <div class="bg-amber-100 px-3 py-1 rounded-full text-amber-600 text-xs font-bold">🪙 <span id="shop-coin-balance">0</span></div>
        </nav>
        <h2 class="text-lg font-medium mb-1">佈置商店</h2>
        <p class="text-[10px] text-gray-400 mb-4">購買家具後進入聊天室，可直接「用手指按住拖曳」擺放位置唷！</p>
        <div id="shop-grid" class="grid grid-cols-3 gap-3 overflow-y-auto max-h-[72vh] pb-6"></div>
    </div>

    <div id="diary-page" class="p-6 hidden pb-24">
        <button onclick="goBack()" class="mb-6 text-xs text-gray-400">✕ 返回</button>
        <h2 class="text-lg font-medium mb-4">內在成長日誌</h2>
        <div class="bg-white rounded-[2.5rem] p-6 shadow-sm border border-gray-50 mb-6">
            <h3 id="calendar-title" class="text-center font-medium text-sm text-gray-600 mb-4"></h3>
            <div class="calendar-grid text-center text-[10px] text-gray-400 mb-2 font-bold">
                <div class="text-red-400">日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="text-blue-400">六</div>
            </div>
            <div id="calendar-body" class="calendar-grid"></div>
        </div>
        <p class="text-[10px] text-gray-400 mb-2 font-bold tracking-wider uppercase">回憶相片牆</p>
        <div id="photo-wall" class="grid grid-cols-2 gap-2 max-h-[40vh] overflow-y-auto"></div>
    </div>

    <script type="module">

        import { getDatabase, ref, push, onChildAdded, set, get, off, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBE_KthL9aaKe33VXaJKXKGpc_MV8Pj5Ys",
            authDomain: "mood-base-d5c89.firebaseapp.com",
            databaseURL: "https://mood-base-d5c89-default-rtdb.firebaseio.com",

        ];

        // 🎨 完美修改：對應你指定的主題色系背景
        const moodSettings = {
            good: { bg: "#FFF4CC", tip: "開心滿分！", quote: "🎉 太棒了！維持這份喜悅，今天你就是身邊人的小太陽，去把快樂分享出去吧！" }, // 黃色
            calm: { bg: "#FFE6D5", tip: "風平浪靜。", quote: "☁️ 平靜是一種難得的超能力。在不浮不躁的時光裡，好好享受當下的呼吸與安寧。" }, // 灰橘色
            tired: { bg: "#E6D6E6", tip: "能量條低落...", quote: "😮‍💨 辛苦你了，累了就放空、就躺平。世界會等你的，今天不需要做個完美的人。" }, // 灰紫色
            anxious: { bg: "#D9E6F2", tip: "心跳有點快。", quote: "😰 焦慮就像天空的浮雲，它會來，也一定會走。試著摸摸胸口，對自己說一聲：沒事的。" }, // 霧藍色
            angry: { bg: "#EFE5DC", tip: "胸口熱熱的。", quote: "😡 憤怒代表你在乎、代表你受委屈了。深呼吸，別用別人的錯誤來懲罰珍貴的自己。" }  // 奶茶色
        };

        window.onload = async () => {
            document.getElementById('display-date').innerText = new Date().toLocaleDateString('zh-TW', { month: 'long', day: 'numeric', weekday: 'short' });
            const savedUid = localStorage.getItem('mood_base_uid');
            user.uid = savedUid || "u" + Math.random().toString(36).substr(2, 9);
            if(!savedUid) localStorage.setItem('mood_base_uid', user.uid);
            
            const snap = await get(ref(db, 'users/' + user.uid));
            if (snap.exists()) {
                user = { ...user, ...snap.val() };
                if (!user.nick) showPage('setup-page');
                else { showPage('home-page'); updateHomeUI(); checkInvite(); }
            } else { showPage('setup-page'); }
        };

        function checkInvite() {
            const rid = new URLSearchParams(window.location.search).get('room');
            if(rid) enterRoom(rid, "朋友的祕密基地");
        }

        window.confirmNickname = async () => {
            const nick = document.getElementById('init-nick').value.trim();
            if(!nick) return alert("請輸入一個暱稱～");
            user.nick = nick;
            await set(ref(db, 'users/' + user.uid), user);
            showPage('home-page'); updateHomeUI(); checkInvite();
        };

        window.selectMood = (m, emoji) => {
            if (user.lastCheckIn === todayStr) return;
            user.moodToday = m; user.moodEmoji = emoji;
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('mood-active'));
            document.getElementById('btn-' + m).classList.add('mood-active');
            document.getElementById('mood-feedback').innerText = moodSettings[m].tip;
        };

        window.lockMood = async () => {
            if (!user.moodToday) return alert("請先選取一個今天的心情符號唷！");
            if (user.lastCheckIn === todayStr) return;
            user.lastCheckIn = todayStr;
            await set(ref(db, `logs/${user.uid}/${todayStr}`), user.moodEmoji);
            await set(ref(db, 'users/' + user.uid), user);
            updateHomeUI();
            alert(`【情緒基地心靈簽到】\n\n${moodSettings[user.moodToday].quote}`);
        };

        window.doTask = async (n) => {
            if(localStorage.getItem(`t_${n}_${todayStr}`)) return alert("這項任務今天已經完成囉！");

            localStorage.setItem(`t_${n}_${todayStr}`, "1");
            await set(ref(db, 'users/' + user.uid), user);
            updateHomeUI();
            alert("🎉 任務完成！獲得 10 枚金幣！");
        };

            showPage('shop-page');
            const grid = document.getElementById('shop-grid');

                const hasItem = user.inventory && user.inventory.includes(item.id);
                return `
                    <div class="shop-item flex flex-col justify-between h-36">
                        <div class="text-3xl mt-2">${item.icon}</div>
                        <div class="text-[10px] font-medium text-gray-500">${item.name}</div>
                        <button onclick="buyItem(${item.id}, ${item.price})" class="w-full mt-2 text-[9px] py-1 rounded-xl transition ${hasItem ? 'bg-gray-100 text-gray-400':'bg-amber-100 text-amber-700 font-bold'}">
                            ${hasItem ? '已擁有' : item.price + ' 🪙'}
                        </button>
                    </div>
                `;
            }).join('');
            document.getElementById('shop-coin-balance').innerText = user.coins;
        };

        window.buyItem = async (id, price) => {
            if(!user.inventory) user.inventory = [];
            if(user.inventory.includes(id)) return;
            if(user.coins < price) return alert("金幣不太夠呢！");
